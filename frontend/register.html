<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SkyBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="form-page">
    <form id="registerForm" class="card">
      <h2>Create Account</h2>
      <label for="name">Full name</label>
      <input type="text" id="name" maxlength="100" required>
      <label for="email">E-mail</label>
      <input type="email" id="email" required>
      <label for="phone">Phone</label>
      <input type="tel" id="phone" pattern="[0-9]{10}" title="Exactly 10 digits" required>
      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>
      <p id="message" class="error"></p>
      <button type="submit" class="btn-primary">Register</button>
      <p>Already registered? <a href="login.html">Login</a> &middot; <a href="index.html">Home</a></p>
    </form>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
