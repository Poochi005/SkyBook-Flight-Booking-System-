<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - SkyBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <nav class="navbar">
    <a href="index.html" class="logo">&#9992; SkyBook</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li id="bookingsLink"><a href="mybookings.html">My Bookings</a></li>
      <li id="adminLink" style="display:none"><a href="admin.html">Admin Panel</a></li>
      <li id="loginLink"><a href="login.html">Login</a></li>
      <li id="registerLink"><a href="register.html" class="btn-accent">Register</a></li>
      <li id="userBox" style="display:none">
        <span id="userName"></span>
        <button id="logoutBtn" class="btn-accent" style="border:0;padding:7px 14px;border-radius:5px;font-weight:600">Logout</button>
      </li>
    </ul>
  </nav>
</header>
  <main>
    <h2>My bookings</h2>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>PNR</th><th>Flight</th><th>Route</th><th>Departure</th>
            <th>Passengers</th><th>Amount</th><th>Status</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="bookingRows">
          <!-- rows are added by mybookings.js after calling GET /api/bookings/my -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/mybookings.js"></script>
<footer><p>&copy; 2026 SkyBook | Flight Ticket Booking System</p></footer>
</body></html>
