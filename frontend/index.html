
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b4bdb">
  <title>Login - SkyBook</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 34px 30px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 20px 50px #0003;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #eeecff;
      font-size: 32px;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #24213a;
      font-size: 27px;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    .field { margin-bottom: 17px; }

    label {
      display: block;
      margin-bottom: 7px;
      color: #38364a;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9d8e5;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #6654dc;
      box-shadow: 0 0 0 3px #6654dc18;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #6654dc;
      color: white;
      font-weight: 700;
    }

    .btn-primary:hover:not(:disabled) { background: #5140c2; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #999;
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #e5e5eb;
    }

    .btn-google {
      width: 100%;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border: 1px solid #dddce6;
      border-radius: 9px;
      background: white;
      color: #333;
      font-weight: 600;
    }

    .btn-google:hover:not(:disabled) { background: #f8f8fc; }

    .google-icon { width: 19px; height: 19px; }

    .toggle-text {
      margin: 22px 0 0;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .toggle-text a {
      margin-left: 4px;
      color: #6654dc;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: #a32020;
      background: #fdecec;
    }

    .message.success {
      display: block;
      color: #176c36;
      background: #e8f6ed;
    }

    .message.info {
      display: block;
      color: #244e8a;
      background: #eaf2ff;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #6654dc;
      text-decoration: none;
    }

    @media (max-width: 420px) {
      .login-card { padding: 28px 22px; }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">✈️</div>

    <h1 id="formTitle">Welcome back</h1>
    <p class="subtitle" id="formSubtitle">Sign in to continue to SkyBook</p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="authForm">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email"
               placeholder="you@example.com" autocomplete="email"
               required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               placeholder="Enter password" autocomplete="current-password"
               minlength="6" required>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        Sign In
      </button>
    </form>

    <div class="divider">OR</div>

    <button type="button" class="btn-google" id="googleBtn">
      <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11c-.5 2.5-1.9 4.6-4.1 6v5h6.6c3.9-3.6 6.1-8.7 6.1-14.7z"/>
        <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.2C9.2 39.5 16 44 24 44z"/>
        <path fill="#FBBC05" d="M12.6 27.8a12 12 0 0 1 0-7.6V15H5.8a20 20 0 0 0 0 18z"/>
        <path fill="#EA4335" d="M24 11.8c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 5.8 29.5 4 24 4 16 4 9.2 8.5 5.8 15l6.8 5.2c1.6-4.8 6.1-8.4 11.4-8.4z"/>
      </svg>
      Continue with Google
    </button>

    <p class="toggle-text">
      <span id="toggleQuestion">Don't have an account?</span>
      <a href="#" id="toggleLink">Sign up</a>
    </p>

    <a href="./index.html" class="back-link">← Back to SkyBook</a>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

  <script>
    // Firebase Web App configuration from your Firebase project.
    const firebaseConfig = {
      apiKey: "AIzaSyAx0gRlPE9rQszsqGIM-msVyU5V-ZqzqFY",
      authDomain: "login-page-bf89d.firebaseapp.com",
      projectId: "login-page-bf89d",
      storageBucket: "login-page-bf89d.firebasestorage.app",
      messagingSenderId: "565031477506",
      appId: "1:565031477506:web:71197287838c5ce8e7221b",
      measurementId: "G-TWGTWRKY56"
    };

    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const googleBtn = document.getElementById("googleBtn");
    const toggleLink = document.getElementById("toggleLink");
    const toggleQuestion = document.getElementById("toggleQuestion");
    const formTitle = document.getElementById("formTitle");
    const formSubtitle = document.getElementById("formSubtitle");
    const messageEl = document.getElementById("message");

    let isSignUp = false;
    let auth = null;

    function showMessage(text, type = "info") {
      messageEl.textContent = text;
      messageEl.className = "message " + type;
    }

    function clearMessage() {
      messageEl.textContent = "";
      messageEl.className = "message";
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      googleBtn.disabled = loading;
      toggleLink.style.pointerEvents = loading ? "none" : "auto";
      submitBtn.textContent = loading
        ? "Please wait..."
        : (isSignUp ? "Create Account" : "Sign In");
    }

    function readableAuthError(error) {
      console.error("Authentication error:", error);
      const messages = {
        "auth/email-already-in-use": "This email is already registered. Please sign in.",
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/invalid-credential": "Incorrect email or password.",
        "auth/user-not-found": "No account found. Please sign up first.",
        "auth/wrong-password": "Incorrect email or password.",
        "auth/weak-password": "Choose a password with at least 6 characters.",
        "auth/too-many-requests": "Too many attempts. Please wait and try again.",
        "auth/network-request-failed": "Network error. Check your internet connection.",
        "auth/operation-not-allowed": "This sign-in method is not enabled in Firebase Console.",
        "auth/unauthorized-domain": "Add poochi005.github.io to Firebase Authorized domains.",
        "auth/popup-blocked": "Your browser blocked the Google sign-in popup.",
        "auth/popup-closed-by-user": "The Google sign-in window was closed.",
        "auth/cancelled-popup-request": "Another sign-in popup is already open.",
        "auth/account-exists-with-different-credential": "This email is registered using another sign-in method."
      };

      return messages[error.code] || error.message || "Sign-in failed. Please try again.";
    }

    function updateMode() {
      clearMessage();
      formTitle.textContent = isSignUp ? "Create an account" : "Welcome back";
      formSubtitle.textContent = isSignUp
        ? "Sign up to start using SkyBook"
        : "Sign in to continue to SkyBook";
      toggleQuestion.textContent = isSignUp
        ? "Already have an account?"
        : "Don't have an account?";
      toggleLink.textContent = isSignUp ? "Sign in" : "Sign up";
      passwordInput.autocomplete = isSignUp ? "new-password" : "current-password";
      submitBtn.textContent = isSignUp ? "Create Account" : "Sign In";
    }

    toggleLink.addEventListener("click", function(event) {
      event.preventDefault();
      isSignUp = !isSignUp;
      updateMode();
    });

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      clearMessage();

      if (!auth) {
        showMessage("Firebase did not initialize. Check the Firebase configuration and reload.", "error");
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      setLoading(true);

      try {
        let result;

        if (isSignUp) {
          result = await auth.createUserWithEmailAndPassword(email, password);
          showMessage("Account created successfully!", "success");
        } else {
          result = await auth.signInWithEmailAndPassword(email, password);
          showMessage("Login successful!", "success");
        }

        console.log("Firebase user:", result.user.uid, result.user.email);

        // Keep this page open until you choose the correct destination.
        // Firebase login does not automatically log the user into the SkyBook
        // Spring Boot backend. Backend integration may still be required.
      } catch (error) {
        showMessage(readableAuthError(error), "error");
      } finally {
        setLoading(false);
      }
    });

    googleBtn.addEventListener("click", async function() {
      clearMessage();

      if (!auth) {
        showMessage("Firebase did not initialize. Check the Firebase configuration and reload.", "error");
        return;
      }

      googleBtn.disabled = true;
      submitBtn.disabled = true;

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });

        const result = await auth.signInWithPopup(provider);
        showMessage(
          "Google login successful! Welcome " +
          (result.user.displayName || result.user.email) + ".",
          "success"
        );

        console.log("Google user:", result.user.uid, result.user.email);
      } catch (error) {
        showMessage(readableAuthError(error), "error");
      } finally {
        googleBtn.disabled = false;
        submitBtn.disabled = false;
      }
    });

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      auth = firebase.auth();

      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
        .catch(error => console.error("Persistence error:", error));

      auth.onAuthStateChanged(function(user) {
        if (user) {
          console.log("Signed-in Firebase user:", user.email, user.uid);
        }
      });
    } catch (error) {
      console.error("Firebase initialization error:", error);
      showMessage("Firebase initialization failed. Check your Firebase project settings.", "error");
    }
  </script>
</body>
</html>
