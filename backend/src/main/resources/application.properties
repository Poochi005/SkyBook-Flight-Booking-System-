# Local development defaults. Railway/Render can override these with environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flight_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
server.port=${PORT:8080}

skybook.seed.enabled=${SKYBOOK_SEED_ENABLED:true}
skybook.admin.email=${SKYBOOK_ADMIN_EMAIL:admin@skybook.com}
skybook.admin.password=${SKYBOOK_ADMIN_PASSWORD:admin123}
